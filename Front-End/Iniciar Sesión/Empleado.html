<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel del Empleado - MinisuperJJ</title>
    <style>
      :root{--bg:#f4f7fb;--card:#fff;--accent:#1671ad;--muted:#6b7280}
      html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#eef2f7)}
      .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
      .card{background:var(--card);width:100%;max-width:640px;padding:28px;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,0.06)}
      h1{margin:0 0 6px;font-size:24px;color:#0f172a}
      p.lead{margin:0 0 18px;color:var(--muted)}
      .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
      .opt{background:#f8fafc;border:1px solid #e6eef7;padding:14px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
      .opt h3{margin:0;font-size:16px;color:#1671ad}
      .opt p{margin:0;font-size:13px;color:var(--muted)}
      .opt:active{transform:translateY(1px)}
      .note{margin-top:12px;font-size:13px;color:var(--muted)}
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="card" role="main">
        <h1>Panel del Empleado</h1>
        <p class="lead">Elige una opción para empezar</p>
        <div class="options" role="list">
          <button class="opt" onclick="window.location.href='../Inventario/Registro_producto.html'" role="listitem" aria-label="Ir a Registro de Producto">
            <h3>Registro de Producto</h3>
            <p>Registrar nuevos productos.</p>
          </button>
          <button class="opt" onclick="window.location.href='../Inventario/Registro_venta.html'" role="listitem" aria-label="Ir a Registro de Venta">
            <h3>Registro de Venta</h3>
            <p>Registrar ventas realizadas.</p>
          </button>
          <button class="opt" onclick="window.location.href='../Caja/Gestion.html'" role="listitem" aria-label="Ir a Gestión">
            <h3>Gestión</h3>
            <p>Acceder a opciones de gestión.</p>
          </button>
          <button class="opt" onclick="window.location.href='../Alertas/Alertas.html'" role="listitem" aria-label="Ir a Alertas">
            <h3>Alertas</h3>
            <p>Ver alertas del sistema.</p>
          </button>
          <button class="opt" onclick="window.location.href='../Gestionar Adeudos/Adeuso.html'" role="listitem" aria-label="Ir a Adeudos">
            <h3>Adeudos</h3>
            <p>Gestionar adeudos pendientes.</p>
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
